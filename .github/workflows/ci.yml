name: Host checks
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check specification and Cortex-M4 ELF
        run: make check PROBE_CC="clang --target=arm-none-eabi -fuse-ld=lld"
